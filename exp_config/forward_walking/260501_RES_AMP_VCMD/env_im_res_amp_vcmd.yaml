# phc/data/cfg/env/env_im_res_amp_vcmd.yaml
# 1D v_cmd-conditioned imitation training on top of frozen phc_3.
# Spec: docs/superpowers/specs/2026-05-01-phc-residual-amp-vcmd-design.md

project_name: "PHC_ResAMP_VCmd"
notes: "Residual AMP with v_cmd conditioning on frozen phc_3"

disable_multiprocessing: False

env:
  motion_file: "sample_data/amass_walking_3clips_seamless_60s_v9.pkl"
  num_envs: 32                          # smoke; server sbatch overrides to 512. 4060 Ti 7.6 GB OOMs on backward at 64 envs due to frozen phc_3 PNN forward activations.
  numEnvs: 32
  env_spacing: 5
  envSpacing: 5
  episode_length: 300                   # 5s @ 60Hz; server uses 600
  episodeLength: 300
  is_flag_run: False
  enable_debug_vis: False

  # PHC standard
  cycle_motion: True
  numAMPObsSteps: 10
  has_self_collision: True

  power_scale: 1.0
  controlFrequencyInv: 2               # 30 Hz
  stateInit: "Random"

  enableEarlyTermination: True
  terminationDistance: 1.0
  terminationHeight: 0.4               # min pelvis height for termination

  # v_cmd-specific (spec §6)
  v_cmd_min: 0.76
  v_cmd_max: 1.23
  v_cmd_max_accel: 0.5
  v_cmd_ramp_prob: 0.01
  hysteresis: 0.02

  # Reward weights (spec §5.4)
  task_reward_w: 0.5
  disc_reward_w: 0.3
  im_reward_w: 0.2
  alpha_track: 5.0
  alpha_im: 2.0

  # Action clipping (spec §5.4 "Action clipping")
  delta_action_clip: 0.2

  # PHC standard obs/tracking
  local_root_obs: True
  root_height_obs: True
  key_bodies: ["R_Ankle", "L_Ankle", "R_Wrist", "L_Wrist"]
  contact_bodies: ["R_Ankle", "L_Ankle", "R_Toe", "L_Toe"]
  reset_bodies: ['Pelvis', 'L_Hip', 'L_Knee', 'R_Hip', 'R_Knee', 'Torso', 'Spine',
                 'Chest', 'Neck', 'Head', 'L_Thorax', 'L_Shoulder', 'L_Elbow',
                 'L_Wrist', 'L_Hand', 'R_Thorax', 'R_Shoulder', 'R_Elbow', 'R_Wrist', 'R_Hand']

  numTrajSamples: 3
  trajSampleTimestepInv: 3
  enableTaskObs: True
  # NOTE: trackBodies intentionally omitted so it defaults to _full_track_bodies
  # (24 SMPL bodies). phc_3 was trained without this override (env=env_im_pnn,
  # see output/HumanoidIm/phc_3/.hydra/overrides.yaml), giving obs_dim=934.
  # Adding trackBodies here would break frozen-base obs compatibility.
  # See 02_research_dev/260501_phc_3_obs_dim_investigation.md for full derivation.
  reward_specs:
    k_pos: 200
    k_rot: 10
    k_vel: 1.0
    k_ang_vel: 0.1
    w_pos: 0.4
    w_rot: 0.3
    w_vel: 0.2
    w_ang_vel: 0.1

  # PHC standard extras
  fut_tracks: False
  obs_v: 6
  auto_pmcp: False
  auto_pmcp_soft: True
  has_pnn: False
  fitting: False
  num_prim: 1
  training_prim: 0
  actors_to_load: 0
  has_lateral: False
  zero_out_far: True
  zero_out_far_train: False
  getup_udpate_epoch: 1000
  getup_schedule: False
  recoverySteps: 90
  zero_out_far_steps: 90
  recoveryEpisodeProb: 0.5
  fallInitProb: 0.3
  hard_negative: False
  z_activation: "silu"
  kp_scale: 1
  power_reward: True   # Match phc_3; sizes self.reward_raw to 5 cols which AmpAgent's logger indexes (reward_raw[4]). We override the rewards so the actual power term is unused.
  hybridInitProb: 0.5

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0

robot:
  humanoid_type: smpl
  asset:
    assetRoot: "/"
    assetFileName: "mjcf/smpl_humanoid.xml"

control:
  # Match phc_3 training config (output/HumanoidIm/phc_3/.hydra/config.yaml).
  # 'isaac_pd' lets IsaacGym handle PD via DOF props; 'pd' would require
  # SMPL-specific p_gains/d_gains which humanoid.py only sets for h1/g1.
  control_mode: "isaac_pd"
  powerScale: 1.0
  action_scale: 1.0

domain_rand:
  has_domain_rand: False

sim:
  substeps: 2
  physx:
    step_dt: "1.0 / 60.0"
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
