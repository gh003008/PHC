project_name: "PHC_Walk_Baseline"
notes: "VIC4_VCMD S16 — S14 base + knee_angle_reward (L_Knee + R_Knee × 3 axes, w=0.3, k=20). Tests if direct knee DOF tracking fixes the un-bent-knee slide gait observed in S10–S14 video. Avoids body rotation tracking that broke S15 in multiclip."

disable_multiprocessing: False

env:
  motion_file: "sample_data/amass_walking_3clips_seamless_60s_v9.pkl"
  num_envs: 256          # 384 boot OOM today: node swap full from concurrent user jobs
  numEnvs: 256
  env_spacing: 5
  envSpacing: 5
  episode_length: 300
  episodeLength: 300
  is_flag_run: False
  enable_debug_vis: False

  fut_tracks: False
  obs_v: 6
  auto_pmcp: False
  auto_pmcp_soft: True

  has_pnn: False
  fitting: False
  num_prim: 1
  training_prim: 0
  actors_to_load: 0
  has_lateral: False

  zero_out_far: True
  zero_out_far_train: False
  cycle_motion: True
  getup_udpate_epoch: 1000
  getup_schedule: False
  recoverySteps: 90
  zero_out_far_steps: 90
  recoveryEpisodeProb: 0.0
  fallInitProb: 0.0
  hard_negative: False

  z_activation: "silu"
  kp_scale: 1
  power_reward: True
  power_coefficient: 0.0000005
  shape_resampling_interval: 100000   # disabled — node swap exhausted, can't survive spike

  controlFrequencyInv: 2
  vic_enabled: True
  vic_curriculum_stage: 2
  vic_metabolic_reward_w: 0.01
  vic_ccf_min: -1.0
  vic_ccf_max: 1.0

  cmd_v_range: [0.0, 0.0]
  cmd_w_range: [0.0, 0.0]
  cmd_tracking_w: 0.0
  cmd_track_kv: 2.0
  cmd_track_kw: 1.0

  retime_scale_range: [0.85, 1.15]

  multiclip_v_cmd_range: [0.76, 1.23]
  multiclip_v_nat_path: "sample_data/amass_walking_3clips_seamless_60s_v9_dirmeta.json"
  multiclip_retime_enabled: True
  multiclip_resample_on_cycle: False

  vic_ccf_num_groups: 4
  vic_ccf_sigma_init: -1.0
  vic_phase_obs: True

  reward_curriculum_switch_epoch: 10000
  reward_w_stage1_task: 0.7
  reward_w_stage1_disc: 0.3
  reward_w_stage2_task: 0.5
  reward_w_stage2_disc: 0.5

  foot_pos_reward_w: 0.3
  foot_pos_reward_k: 30.0

  # S16: knee angle reward — direct DOF-level tracking of L_Knee, R_Knee.
  # 6 DOFs (2 knees × 3 axes), MSE per DOF mean → exp(-k * err) * w.
  # Typical "good" tracking: per-DOF err ~0.1 rad → err²~0.01 → exp(-20*0.01)≈0.82.
  # "Bad" tracking: per-DOF err ~0.5 rad → err²~0.25 → exp(-20*0.25)≈0.007.
  knee_angle_reward_w: 0.3
  knee_angle_reward_k: 20.0

  stateInit: "Hybrid"
  hybridInitProb: 0.5
  numAMPObsSteps: 10

  local_root_obs: True
  root_height_obs: True
  key_bodies: ["R_Ankle", "L_Ankle", "R_Wrist", "L_Wrist"]
  contact_bodies: ["R_Ankle", "L_Ankle", "R_Toe", "L_Toe"]
  reset_bodies: ['Pelvis', 'L_Hip', 'L_Knee', 'R_Hip', 'R_Knee', 'Torso', 'Spine',
                 'Chest', 'Neck', 'Head', 'L_Thorax', 'L_Shoulder', 'L_Elbow',
                 'L_Wrist', 'L_Hand', 'R_Thorax', 'R_Shoulder', 'R_Elbow', 'R_Wrist', 'R_Hand']
  terminationHeight: 0.15
  enableEarlyTermination: True
  terminationDistance: 0.5

  numTrajSamples: 3
  trajSampleTimestepInv: 3
  enableTaskObs: True
  trackBodies: ["R_Ankle", "L_Ankle", "R_Wrist", "L_Wrist"]
  reward_specs:
    k_pos: 200
    k_rot: 10
    k_vel: 1.0
    k_ang_vel: 0.1
    w_pos: 0.4
    w_rot: 0.3
    w_vel: 0.2
    w_ang_vel: 0.1

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0

robot:
  humanoid_type: smpl
  asset:
    assetRoot: "/"
    assetFileName: "mjcf/smpl_humanoid.xml"

control:
  control_mode: "pd"
  powerScale: 1.0
  action_scale: 0.5

domain_rand:
  has_domain_rand: False

sim:
  substeps: 2
  physx:
    step_dt: "1.0 / 60.0"
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
