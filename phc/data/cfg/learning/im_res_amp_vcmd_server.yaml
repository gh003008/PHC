# phc/data/cfg/learning/im_res_amp_vcmd_server.yaml
# Server-side variant of im_res_amp_vcmd.yaml — same arch / hparams, only
# buffer sizes and minibatch widths bumped for the A5000 24 GB / 512-env
# Stage 2 run. Other knobs (num_envs / episode_length / max_iterations /
# minibatch_size) are passed via CLI from train_phc_res_amp_vcmd.sh.
# Spec: docs/superpowers/specs/2026-05-01-phc-residual-amp-vcmd-design.md §7 Stage 2

params:
  seed: 0

  algo:
    name: im_amp_residual

  model:
    name: amp_residual

  network:
    name: amp_pnn_residual
    separate: True
    discrete: False

    # Required by inherited AMPPNNBuilder.Network.load(params).
    # The actual policy is frozen_base + residual; these blocks satisfy the
    # rl_games builder's expected schema. mlp.units below describes the critic
    # only (the actor is the frozen PNN + residual head).
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.0
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 512]
      activation: silu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

    # Frozen base — same arch as phc_3 (im_pnn_big), loaded from checkpoint
    frozen_base:
      checkpoint: output/HumanoidIm/phc_3/Humanoid.pth
      mlp_units: [2048, 1536, 1024, 1024, 512, 512]
      activation: silu
      num_actors: 3   # PNN primitives

    # Residual head (spec §3 "ResAMPVCmdNetwork")
    residual:
      input_dims: ["proprio", "v_cmd"]   # proprio + 1-D v_cmd
      mlp_units: [256, 256]
      activation: silu
      # sigma_init=-2.5 → std=0.082, close to phc_3's own action sigma (~0.055).
      # Spec §3 originally specified -1.0 (std=0.37), but that adds ±37% noise on
      # every PD target each step — humanoid wobbles and falls in ~17 steps no
      # matter how good Δa_mu becomes. Smoke (500 ep, sigma=-1.0) confirmed this:
      # eps_len 12.9 → 17.4, never escaping the noise floor. With -2.5 the frozen
      # baseline's gait shines through from Ep 1 and residual learns finer Δa.
      sigma_init: -2.5
      learn_sigma: False

    # AMP discriminator (unchanged from im_pnn_big.yaml)
    disc:
      units: [1024, 512]
      activation: relu
      initializer:
        name: default

  load_checkpoint: False    # we load phc_3 ourselves into frozen_base

  config:
    name: ResAMPVCmd
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-5       # smaller than im_pnn_big since residual only
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 500           # smoke; server overrides to 20000
    save_best_after: 50
    save_frequency: 250
    print_stats: False
    save_intermediate: True
    entropy_coef: 0.0
    truncate_grads: True
    grad_norm: 50.0
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 512       # smoke: num_envs=32 × horizon=32 = 1024 total; 1024/512=2 minibatches per epoch
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    bounds_loss_coef: 10

    # AMP discriminator hyperparams — server (24 GB A5000) sizes
    amp_obs_demo_buffer_size: 200000
    amp_replay_buffer_size: 200000
    amp_replay_keep_prob: 0.01
    amp_batch_size: 4096
    amp_minibatch_size: 4096      # must be <= minibatch_size; CLI sets minibatch_size=8192
    disc_coef: 5
    disc_logit_reg: 0.01
    disc_grad_penalty: 5
    disc_reward_scale: 2
    disc_weight_decay: 0.0001
    normalize_amp_input: True

    # Reward decomposition (spec §5.4)
    task_reward_w: 0.5     # r_track
    disc_reward_w: 0.3     # r_amp
    im_reward_w: 0.2       # r_im anchor
    survive_reward_w: 1.0

    amp_dropout: False

    player:
      games_num: 50000000
