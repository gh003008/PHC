# V2 learning config — Gate 2.
# Reuses existing amp_pnn_residual network builder (res_amp_network.py),
# but loaded with V2 task class + V2 env yaml. Verification: phc_3 alone
# (PHC_ZERO_RESIDUAL=1) walks for 1799 steps via this network path.
#
# Spec: docs/superpowers/specs/2026-05-02-phc-residual-amp-vcmd-v2-design.md
# Failure analysis: 02_research_dev/260502_res_amp_vcmd_failure_analysis.md

params:
  seed: 0

  algo:
    name: im_amp_residual

  model:
    name: amp_residual

  network:
    name: amp_pnn_residual
    separate: True
    discrete: False

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.0
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 512]
      activation: silu
      d2rl: False
      initializer:
        name: default
      regularizer:
        name: None

    # Frozen base — phc_3
    frozen_base:
      checkpoint: output/HumanoidIm/phc_3/Humanoid.pth
      mlp_units: [2048, 1536, 1024, 1024, 512, 512]
      activation: silu
      num_actors: 3

    # Residual head (small, fits 4060 Ti 7.6 GB; matches v2 spec)
    residual:
      input_dims: ["proprio", "v_cmd"]
      mlp_units: [256, 256]
      activation: silu
      sigma_init: -2.5         # std ~0.082, matches phc_3's sigma scale
      learn_sigma: False
      v_cmd_dim: 1

    # AMP discriminator
    disc:
      units: [1024, 512]
      activation: relu
      initializer:
        name: default

  load_checkpoint: False

  config:
    name: ResAMPVCmdV2
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 5e-5
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 20000
    save_best_after: 50
    save_frequency: 250
    print_stats: False
    save_intermediate: True
    entropy_coef: 0.0
    truncate_grads: True
    grad_norm: 50.0
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 512
    mini_epochs: 6
    critic_coef: 5
    clip_value: False
    bounds_loss_coef: 10

    # AMP discriminator hyperparams (smoke sizes for 4060 Ti)
    amp_obs_demo_buffer_size: 20000
    amp_replay_buffer_size: 20000
    amp_replay_keep_prob: 0.01
    amp_batch_size: 512
    amp_minibatch_size: 512
    disc_coef: 5
    disc_logit_reg: 0.01
    disc_grad_penalty: 5
    disc_reward_scale: 2
    disc_weight_decay: 0.0001
    normalize_amp_input: True

    # Reward decomposition (V2 spec — no r_survive, weights sum to 1.0)
    task_reward_w: 0.5
    disc_reward_w: 0.3
    im_reward_w: 0.2
    survive_reward_w: 0.0      # V2: r_survive removed (Goodharting fix)

    amp_dropout: False

    player:
      games_num: 50000000
      determenistic: False
