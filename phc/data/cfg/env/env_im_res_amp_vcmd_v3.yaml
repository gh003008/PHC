# V2 env config — Gate 1.
# Mirrors env_im_pnn.yaml's parameter values exactly (the env phc_3 was trained on).
# Wrapped in `env:` block for argparse run.py path (env_im_pnn uses top-level for
# Hydra run_hydra.py path, but values are identical).
#
# Spec: docs/superpowers/specs/2026-05-02-phc-residual-amp-vcmd-v2-design.md
# Failure analysis: 02_research_dev/260502_res_amp_vcmd_failure_analysis.md

project_name: "PHC_ResAMP_VCmd_V2"
notes: "Gate 1: empty subclass of HumanoidIm + env_im_pnn structure"
disable_multiprocessing: False

env:
  task: HumanoidImResAMPVCmdV2
  motion_file: ""
  num_envs: 1
  numEnvs: 1
  env_spacing: 5
  envSpacing: 5
  episode_length: 300
  episodeLength: 300
  is_flag_run: False
  enable_debug_vis: False

  fut_tracks: False
  self_obs_v: 1
  obs_v: 6
  auto_pmcp: False
  auto_pmcp_soft: True

  has_pnn: True
  fitting: False
  num_prim: 3
  training_prim: 0
  actors_to_load: 0
  has_lateral: False
  models: []

  zero_out_far: False
  zero_out_far_train: False
  getup_udpate_epoch: 78750
  cycle_motion: False
  hard_negative: False
  min_length: 5

  kp_scale: 1
  power_reward: True
  shape_resampling_interval: 500

  control_mode: "isaac_pd"
  power_scale: 1.0
  controlFrequencyInv: 2
  stateInit: "Random"
  hybridInitProb: 0.5
  numAMPObsSteps: 10

  local_root_obs: True
  root_height_obs: True
  key_bodies: ["R_Ankle", "L_Ankle", "R_Wrist", "L_Wrist"]
  contact_bodies: ["R_Ankle", "L_Ankle", "R_Toe", "L_Toe"]
  reset_bodies: ['Pelvis', 'L_Hip', 'L_Knee', 'R_Hip', 'R_Knee', 'Torso', 'Spine',
                 'Chest', 'Neck', 'Head', 'L_Thorax', 'L_Shoulder', 'L_Elbow',
                 'L_Wrist', 'L_Hand', 'R_Thorax', 'R_Shoulder', 'R_Elbow', 'R_Wrist', 'R_Hand']
  terminationHeight: 0.15
  enableEarlyTermination: True
  terminationDistance: 0.25

  numTrajSamples: 3
  trajSampleTimestepInv: 3
  enableTaskObs: True

  plane:
    staticFriction: 1.0
    dynamicFriction: 1.0
    restitution: 0.0

robot:
  humanoid_type: smpl
  bias_offset: False
  has_self_collision: True
  has_mesh: False
  has_jt_limit: False
  has_dof_subset: True
  has_upright_start: True
  has_smpl_pd_offset: False
  remove_toe: False
  motion_sym_loss: False
  sym_loss_coef: 1
  big_ankle: True
  has_shape_obs: false
  has_shape_obs_disc: false
  has_shape_variation: False
  masterfoot: False
  freeze_toe: false
  freeze_hand: False
  box_body: True
  real_weight: True
  real_weight_porpotion_capsules: True
  real_weight_porpotion_boxes: True
  asset:
    assetRoot: "/"
    assetFileName: "mjcf/smpl_humanoid.xml"

control:
  control_mode: "isaac_pd"
  powerScale: 1.0
  action_scale: 1.0

domain_rand:
  has_domain_rand: False

sim:
  substeps: 2
  physx:
    step_dt: "1.0 / 60.0"
    num_threads: 4
    solver_type: 1
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    default_buffer_size_multiplier: 10.0
  flex:
    num_inner_iterations: 10
    warm_start: 0.25
