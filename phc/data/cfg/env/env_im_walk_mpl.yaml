task: HumanoidImVIC
project_name: "PHC_Walk_MPL"
notes: "Motion Plan Layer - H5 real walking data from Vicon PiG"

disable_multiprocessing: False

motion_file: "sample_data/amass_isaac_walking_primitive.pkl"
fix_height_mode: "full_fix"
im_eval_override: True
randomrize_heading: False
num_envs: 128
numEnvs: 128
env_spacing: 5
envSpacing: 5
episode_length: 150
episodeLength: 150
is_flag_run: False
enable_debug_vis: False

fut_tracks: False
obs_v: 6
auto_pmcp: False
auto_pmcp_soft: True

######## PNN Configs ########
has_pnn: False
fitting: False
num_prim: 1
training_prim: 0
actors_to_load: 0
has_lateral: False

######## Getup Configs ########
zero_out_far: True
zero_out_far_train: False
cycle_motion: False
getup_udpate_epoch: 1000
getup_schedule: False
recoverySteps: 90
zero_out_far_steps: 90
recoveryEpisodeProb: 0.5
fallInitProb: 0.3
hard_negative: False

z_activation: "silu"
kp_scale: 1
power_reward: True
power_coefficient: 0.000002
shape_resampling_interval: 500

controlFrequencyInv: 2  # 30 Hz
# VIC (Variable Impedance Control) Settings - DISABLED for NoVIC diagnostic run
vic_enabled: False
vic_curriculum_stage: 2 # Stage 2: Learnable CCF (matches proven VIC_PHASE_04)
vic_metabolic_reward_w: 0.0
vic_ccf_min: -0.3 # 0.81x stiffness
vic_ccf_max: 0.3  # 1.23x stiffness
# VIC: CCF Grouping (8 groups: L_hip, L_knee, L_ankle, R_hip, R_knee, R_ankle, upper_left, upper_right)
vic_ccf_num_groups: 4
# VIC: CCF sigma override (log-std, -1.0 => std=0.37 vs PD default -2.9 => std=0.055)
vic_ccf_sigma_init: -2.0
# VIC: Phase observation (sin/cos encoding of motion phase, +2 obs dims)
vic_phase_obs: False
# VIC: Biomechanical CCF reward weight (contact-force based stance/swing ankle+knee CCF guidance)
vic_bio_ccf_reward_w: 0.0
# Foot position imitation reward (extra foot tracking to reduce sliding/dropping)
foot_pos_reward_w: 0.0
foot_pos_reward_k: 40.0
# VIC: Reward Weight Curriculum (epoch < switch_epoch: task-heavy, epoch >= switch_epoch: disc-heavy)
reward_curriculum_switch_epoch: 10000
reward_w_stage1_task: 0.7
reward_w_stage1_disc: 0.3
reward_w_stage2_task: 0.3
reward_w_stage2_disc: 0.7

stateInit: "Random"
hybridInitProb: 0.5
numAMPObsSteps: 10

local_root_obs: True
root_height_obs: True
key_bodies: ["R_Ankle", "L_Ankle", "R_Wrist", "L_Wrist"]
contact_bodies: ["R_Ankle", "L_Ankle", "R_Toe", "L_Toe"]
reset_bodies: ['Pelvis', 'L_Hip', 'L_Knee', 'R_Hip', 'R_Knee', 'Torso', 'Spine',
               'Chest', 'Neck', 'Head', 'L_Thorax', 'L_Shoulder', 'L_Elbow',
               'L_Wrist', 'L_Hand', 'R_Thorax', 'R_Shoulder', 'R_Elbow', 'R_Wrist', 'R_Hand']
terminationHeight: 0.15
enableEarlyTermination: True
terminationDistance: 0.25

numTrajSamples: 3
trajSampleTimestepInv: 3
enableTaskObs: True
trackBodies: ["R_Ankle", "L_Ankle", "R_Wrist", "L_Wrist"]
reward_specs:
  k_pos: 200
  k_rot: 10
  k_vel: 1.0
  k_ang_vel: 0.1
  w_pos: 0.4
  w_rot: 0.3
  w_vel: 0.2
  w_ang_vel: 0.1

plane:
  staticFriction: 1.0
  dynamicFriction: 1.0
  restitution: 0.0
